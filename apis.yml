description: 'Revolving Games is a mobile-first game studio and publishing company
  operating two independent gaming studios with a team of 150+ gaming-industry veterans.
  Its flagship title is War of Nova, a sci-fi 4X space-strategy mobile game for iOS
  and Android spanning base-building, empire-building, and competitive multiplayer
  live-ops gameplay. Backed by Pantera Capital, the company was surfaced through the
  API Evangelist network as a portfolio lead; as of this enrichment pass it publishes
  a consumer marketing website only and exposes no public API, developer portal, SDK,
  or documentation surface.'
